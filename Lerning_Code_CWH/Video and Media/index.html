<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- In audio we need controls so that ih show the built-in playback UI for the audio element. -->

    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" controls
        loop></audio>

    <!-- Here in the video we added poster that will be showed when the video is being leaded -->
    <video src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" loop controls
        muted width="400" poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217"
        width="400"></video>

    
    <svg height="500" width="500">
        <circle cx="100" cy="100" r=50 stroke="black" stroke-width="4" fill="red" />
    </svg>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=N1Y4xLjc1Y6c_aPq"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe src="https://en.wikipedia.org/wiki/Website" frameborder="0" width="500" height="1080"></iframe>
</body>

</html>
