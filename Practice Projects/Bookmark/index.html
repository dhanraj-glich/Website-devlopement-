<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Bookmarks</h1>

    <h3>Primary Bookmarks</h3>

    <ol>
        <li><a href="https:/www.youtube.com" target="_blank">youtube</a></li>
        <li><a href="https:/www.facebook.com" target="_blank">facebook</a></li>
        
    </ol>

  
    <h5>Add new Bookmark</h5>

    <input type="url" placeholder="Enter URL" required >

    <input type="text" placeholder="Website Title" required>
    <input type="text" placeholder="Enter website type:">
    <input type="text" placeholder="Add tag">
    <button>Add new Bookmark</button>
    


</body>
</html>
