<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption>Student Marks(2026)</caption>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
               <!-- Here the td stands for table data -->
        <tr>
            <td colspan="2">Johan</td>
            <td>89</td>
        </tr>

        <tr>
            <td>Daniel</td>
            <td>Science</td>
            <td>80</td>
        </tr>

         <tr>
            <td rowspan="2">Vasco</td>
            <td>Science</td>
            <td>80</td>
         <tr>
            <td>Science</td>
            <td>80</td>

    </table>
</body>
</html>
